<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মহা পেটুক | ডিজিটাল বিলিং কাউন্টার</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #f59e0b;
      --cash: #10b981;
      --upi: #3b82f6;
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding-bottom: 150px; user-select: none; }
    
    header { background: #020617; padding: 12px 16px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .header-title { font-size: 19px; font-weight: 800; color: var(--primary); }
    .status-tag { font-size: 12px; color: #10b981; font-weight: 700; background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; padding: 3px 10px; border-radius: 20px; }

    .search-bar { padding: 10px 16px; background: #0f172a; position: sticky; top: 53px; z-index: 90; }
    .search-input { width: 100%; padding: 11px 14px; background: var(--card); border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 15px; outline: none; }
    .search-input:focus { border-color: var(--primary); }
    
    .food-list { padding: 10px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .food-btn { background: var(--card); border: 1px solid #334155; border-radius: 12px; padding: 12px; text-align: left; cursor: pointer; transition: 0.1s; display: flex; flex-direction: column; justify-content: space-between; position: relative; min-height: 85px; }
    .food-btn:active { transform: scale(0.96); background: #334155; border-color: var(--primary); }
    .food-btn-title { font-size: 15px; font-weight: 700; color: #ffffff; line-height: 1.3; }
    .food-btn-price { font-size: 15px; color: var(--primary); font-weight: 800; margin-top: 6px; }
    .food-count-badge { position: absolute; top: -6px; right: -6px; background: #ef4444; color: #fff; font-size: 12px; font-weight: 800; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg); }
    
    .btn-half-style { border-color: rgba(245, 158, 11, 0.4); background: #26201a; }
    .btn-half-tag { position: absolute; top: 8px; right: 8px; background: var(--primary); color: #000; border-radius: 4px; padding: 2px 6px; font-size: 10px; font-weight: 800; }

    .bill-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: #020617; border-top: 2px solid #334155; padding: 12px 16px; box-shadow: 0 -5px 25px rgba(0,0,0,0.8); z-index: 200; }
    .cart-summary { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .cart-items-preview { font-size: 13px; color: #94a3b8; max-width: 65%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
    .cart-total-val { font-size: 24px; font-weight: 900; color: #facc15; }

    .action-grid { display: grid; grid-template-columns: 1fr 1fr 48px; gap: 10px; }
    .btn-pay { border: none; padding: 14px 10px; border-radius: 10px; font-size: 16px; font-weight: 800; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: 0.15s; }
    .btn-pay:active { transform: scale(0.96); }
    .btn-cash { background: var(--cash); }
    .btn-upi { background: var(--upi); }
    .btn-clear { background: #ef4444; color: white; border: none; border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer; }
    .btn-clear:active { background: #dc2626; }

    .toast { position: fixed; top: 68px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 10px 22px; border-radius: 30px; font-size: 14px; font-weight: 800; display: none; z-index: 300; box-shadow: 0 5px 20px rgba(0,0,0,0.6); }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="header-title">মহা পেটুক কাউন্টার</div>
    </div>
    <div class="status-tag">⚡ এক-ক্লিক এন্ট্রি</div>
  </header>

  <div class="search-bar">
    <input type="text" class="search-input" id="searchFood" placeholder="খাবারের নাম লিখে খুঁজুন...">
  </div>

  <main class="food-list" id="foodContainer"></main>

  <div class="bill-panel">
    <div class="cart-summary">
      <div class="cart-items-preview" id="cartPreview">কোনো খাবার যোগ হয়নি</div>
      <div class="cart-total-val" id="cartTotalDisplay">₹০</div>
    </div>
    <div class="action-grid">
      <button class="btn-pay btn-cash" id="btnCashSubmit" type="button"><i class="fa-solid fa-money-bill-wave"></i> ক্যাশ</button>
      <button class="btn-pay btn-upi" id="btnUpiSubmit" type="button"><i class="fa-solid fa-qrcode"></i> অনলাইন</button>
      <button class="btn-clear" id="btnClearCart" title="মুছে ফেলুন" type="button">✕</button>
    </div>
  </div>

  <div class="toast" id="toastMsg">✅ রেকর্ড গুগল শিটে জমা হয়েছে!</div>

  <script>
    // গুগল ফর্ম অ্যাকশন
    const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSfXxLcbBllSYoxJmBuzkS1BOFtk5kK8m6BvW6lQGn7aVwHeMQ/formResponse';
    const ENTRY_ITEMS = 'entry.1932886441';
    const ENTRY_PAYMENT = 'entry.1217144855';
    const ENTRY_AMOUNT = 'entry.779306446';

    // মহা পেটুকের খাবারের তালিকা (ফুল ও হাফ প্লেটের হিসেবসহ)
    const menuData = [
      { name: "ভেজ চাউমিন", pricing: { full: 50, half: 30, hasHalf: true } },
      { name: "এগ চাউমিন", pricing: { full: 60, half: 35, hasHalf: true } },
      { name: "এগ চিকেন চাউমিন", pricing: { full: 80, half: 45, hasHalf: true } },
      { name: "এগ রোল", pricing: { full: 40, half: 0, hasHalf: false } },
      { name: "চিকেন রোল", pricing: { full: 60, half: 0, hasHalf: false } },
      { name: "ডাবল এগ চিকেন রোল", pricing: { full: 70, half: 0, hasHalf: false } },
      { name: "এগ তড়কা", pricing: { full: 50, half: 30, hasHalf: true } },
      { name: "ভেজ তড়কা", pricing: { full: 40, half: 25, hasHalf: true } },
      { name: "চিকেন কষা (মাংস)", pricing: { full: 120, half: 65, hasHalf: true } },
      { name: "চিকেন ললিপপ", pricing: { full: 100, half: 0, hasHalf: false } },
      { name: "চিকেন পকোড়া", pricing: { full: 80, half: 0, hasHalf: false } },
      { name: "ছোট চিকেন পকোড়া", pricing: { full: 50, half: 0, hasHalf: false } },
      { name: "পরোটা", pricing: { full: 10, half: 0, hasHalf: false } },
      { name: "রুটি", pricing: { full: 6, half: 0, hasHalf: false } }
    ];

    let currentOrder = [];

    function renderFoodButtons(items) {
      const container = document.getElementById('foodContainer');
      container.innerHTML = '';

      items.forEach(item => {
        // ফুল প্লেট
        const fullKey = item.name + ' (ফুল)';
        const fullFound = currentOrder.find(i => i.name === fullKey);
        const btnFull = document.createElement('div');
        btnFull.className = 'food-btn';
        btnFull.innerHTML = `
          ${fullFound ? `<div class="food-count-badge">${fullFound.qty}</div>` : ''}
          <div class="food-btn-title">${item.name}</div>
          <div class="food-btn-price">₹${item.pricing.full}</div>
        `;
        btnFull.onclick = () => addToOrder(fullKey, item.pricing.full);
        container.appendChild(btnFull);

        // হাফ প্লেট
        if (item.pricing.hasHalf) {
          const halfKey = item.name + ' (হাফ)';
          const halfFound = currentOrder.find(i => i.name === halfKey);
          const btnHalf = document.createElement('div');
          btnHalf.className = 'food-btn btn-half-style';
          btnHalf.innerHTML = `
            <span class="btn-half-tag">হাফ</span>
            ${halfFound ? `<div class="food-count-badge">${halfFound.qty}</div>` : ''}
            <div class="food-btn-title">${item.name}</div>
            <div class="food-btn-price">₹${item.pricing.half}</div>
          `;
          btnHalf.onclick = () => addToOrder(halfKey, item.pricing.half);
          container.appendChild(btnHalf);
        }
      });
    }

    function addToOrder(name, price) {
      const found = currentOrder.find(i => i.name === name);
      if (found) {
        found.qty++;
      } else {
        currentOrder.push({ name, price, qty: 1 });
      }
      updateUI();
      renderFoodButtons(getFilteredMenu());
    }

    function updateUI() {
      const totalDisplay = document.getElementById('cartTotalDisplay');
      const preview = document.getElementById('cartPreview');

      if (currentOrder.length === 0) {
        preview.innerText = 'কোনো খাবার যোগ হয়নি';
        totalDisplay.innerText = '₹০';
        return;
      }

      let grandTotal = 0;
      let textArr = [];

      currentOrder.forEach(item => {
        grandTotal += (item.price * item.qty);
        textArr.push(`${item.name} x${item.qty}`);
      });

      totalDisplay.innerText = `₹${grandTotal}`;
      preview.innerText = textArr.join(', ');
    }

    document.getElementById('btnClearCart').onclick = () => {
      currentOrder = [];
      updateUI();
      renderFoodButtons(getFilteredMenu());
    };

    function getFilteredMenu() {
      const query = document.getElementById('searchFood').value.toLowerCase().trim();
      if (!query) return menuData;
      return menuData.filter(i => i.name.toLowerCase().includes(query));
    }

    document.getElementById('searchFood').oninput = () => {
      renderFoodButtons(getFilteredMenu());
    };

    function submitOrder(paymentMode) {
      if (currentOrder.length === 0) {
        alert('আগে অন্তত একটি খাবার যোগ করুন!');
        return;
      }

      const totalAmount = currentOrder.reduce((sum, i) => sum + (i.price * i.qty), 0);
      const itemsString = currentOrder.map(i => `${i.name} [${i.qty}টা]`).join(', ');

      const formData = new FormData();
      formData.append(ENTRY_ITEMS, itemsString);
      formData.append(ENTRY_PAYMENT, paymentMode);
      formData.append(ENTRY_AMOUNT, totalAmount);

      currentOrder = [];
      updateUI();
      renderFoodButtons(getFilteredMenu());
      showToast();

      // সরাসরি গুগল শিটে সেভ হবে
      fetch(FORM_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: formData
      }).catch(err => console.log('Saved silently'));
    }

    function showToast() {
      const t = document.getElementById('toastMsg');
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2200);
    }

    document.getElementById('btnCashSubmit').onclick = () => submitOrder('Cash');
    document.getElementById('btnUpiSubmit').onclick = () => submitOrder('Online (UPI)');

    // সরাসরি মেনু বাটন দেখানো শুরু
    renderFoodButtons(menuData);
  </script>
</body>
</html>
